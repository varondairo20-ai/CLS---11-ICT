<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CLS Monitor — Login</title>

  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#94a3b8;
      --accent:#2563eb;
      --danger:#ef4444;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Inter,ui-sans-serif,system-ui;
      background:linear-gradient(180deg,#071025 0%, #081422 100%);
      color:#e6eef8;
    }

    .login-card{
      width:100%;
      max-width:380px;
      background:var(--card);
      padding:26px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.04);
      box-shadow:0 20px 40px rgba(0,0,0,0.4);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:20px;
    }

    .logo{
      width:46px;
      height:46px;
      border-radius:10px;
      background:linear-gradient(135deg,var(--accent),#7c3aed);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      color:white;
    }

    h1{
      font-size:18px;
      margin:0;
    }

    .small{
      font-size:13px;
      color:var(--muted);
    }

    label{
      display:block;
      margin:14px 0 6px;
      font-size:14px;
      color:var(--muted);
    }

    input{
      width:100%;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.06);
      background:#071224;
      color:white;
      font-size:14px;
      outline:none;
    }

    input:focus{
      border-color:var(--accent);
    }

    .btn{
      margin-top:18px;
      width:100%;
      padding:11px;
      border-radius:10px;
      border:none;
      background:var(--accent);
      color:white;
      font-weight:600;
      cursor:pointer;
    }

    .error{
      margin-top:12px;
      font-size:13px;
      color:var(--danger);
      display:none;
    }

    footer{
      margin-top:18px;
      text-align:center;
      font-size:12px;
      color:var(--muted);
    }
  </style>
</head>

<body>
  <script>
    // Auto-redirect if already logged in
    (function(){
      const role = localStorage.getItem('role');
      if (role === 'teacher') {
        window.location.href = '/teacher-dashboard.html';
      } else if (role === 'student') {
        window.location.href = '/student.html';
      }
    })();
  </script>
  <div class="login-card">
    <div class="brand">
      <div class="logo">CLS</div>
      <div>
        <h1>CLS Monitor</h1>
        <div class="small">Login</div>
      </div>
    </div>

    <label for="username">Username</label>
    <input id="username" type="text" placeholder="Enter username">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter password">

    <button class="btn" onclick="login()">Login</button>

    <div class="error" id="errorMsg"></div>

    <footer>
      Teachers and students use the same login.<br>
      You will be directed to your dashboard after login.
    </footer>
  </div>

  <script>
    function showError(msg) {
      const errEl = document.getElementById('errorMsg')
      errEl.textContent = msg
      errEl.style.display = 'block'
    }

    function hideError() {
      document.getElementById('errorMsg').style.display = 'none'
    }

    async function login() {
      const user = document.getElementById('username').value.trim()
      const pass = document.getElementById('password').value.trim()
      
      if (!user || !pass) {
        showError('Username and password required')
        return
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        })
        
        const data = await res.json()
        if (!res.ok) {
          showError(data.error || 'Login failed')
          return
        }
        
        // Login successful - store credentials and redirect based on role
        localStorage.setItem('role', data.role)
        localStorage.setItem('username', data.username)
        localStorage.setItem('sessionId', data.sessionId)
        localStorage.setItem('loginTime', new Date().toISOString())
        
        hideError()
        
        // Redirect based on role
        if (data.role === 'teacher') {
          window.location.href = '/teacher-dashboard.html'
        } else {
          window.location.href = '/student.html'
        }
      } catch (e) {
        showError('Error: ' + e.message)
      }
    }

    // Allow Enter key to login
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        login()
      }
    })
  </script>
</body>
</html>
