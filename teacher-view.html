<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Teacher View — CLS</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="signal-server" content="wss://cls-11-ict.onrender.com">
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="logo">CLS</div>
      <div>
        <h2 id="title">Teacher View</h2>
        <div class="small" id="targetInfo">Waiting for target...</div>
      </div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
      <span id="statusBadge" class="status-badge disconnected">Disconnected</span>
      <button class="ghost" id="btnMinimize">Minimize</button>
      <button class="ghost" id="btnMaximize">Maximize</button>
      <button class="btn" onclick="window.close()">Close</button>
    </div>
  </header>

  <main style="padding:18px;max-width:1200px;margin:18px auto">
    <section style="display:flex;gap:12px">
      <div style="flex:1">
        <!-- Screen Share Area -->
        <div id="videoWrap" style="position:relative;background:#000;border-radius:8px;padding:8px;min-height:400px;display:flex;align-items:center;justify-content:center;margin-bottom:12px">
            <div id="placeholder" style="color:var(--muted);text-align:center">Waiting for student to share their screen...</div>
            <video id="remoteVideo" autoplay playsinline style="width:100%;height:100%;background:#051224;border-radius:6px;object-fit:contain;display:none"></video>
            <button id="btnFullscreen" style="position:absolute;top:12px;right:12px;padding:8px 12px;border-radius:6px;background:rgba(59,130,246,0.8);color:white;border:none;cursor:pointer;font-size:12px;display:none">⛶ Fullscreen</button>
          </div>
        
        <!-- Webcam Box -->
        <div style="background:#000;border-radius:8px;padding:8px;width:180px;height:180px;display:flex;align-items:center;justify-content:center">
          <div id="webcamPlaceholder" style="color:var(--muted);text-align:center;background:rgba(255,255,255,0.02);border-radius:8px;padding:8px;width:100%;height:100%;display:flex;align-items:center;justify-content:center">Waiting for webcam...</div>
          <video id="webcamVideo" autoplay playsinline style="width:100%;height:100%;border-radius:6px;object-fit:cover;display:none"></video>
        </div>
      </div>
      <aside style="width:260px">
        <div style="background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));padding:12px;border-radius:8px">
          <div style="margin-bottom:8px"><strong>Controls</strong></div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <button class="btn" id="btnScreen">Request Screen</button>
            <button class="btn" id="btnWebcam">Request Webcam</button>
            <button class="ghost" id="btnCloseStream">Stop</button>
          </div>
        </div>
      </aside>
    </section>
  </main>

<script>
  // parse query
  const params = new URLSearchParams(window.location.search)
  const TARGET_ID = params.get('target')
  const TARGET_NAME = params.get('name') || TARGET_ID

  // Prefer local signaling when testing on localhost, otherwise use meta or fallback
  const SIGNALING = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? `ws://${window.location.host}`
    : (document.querySelector('meta[name="signal-server"]')?.content || 'wss://cls-11-ict.onrender.com')
  const RTC_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }

  let ws = null, clientId = null
  const pcs = {} // keyed by mode: 'screen' | 'webcam'

  function setStatus(connected, text){
    const b = document.getElementById('statusBadge')
    if(!b) return
    if(connected){ b.classList.remove('disconnected'); b.classList.add('connected'); b.textContent = text||'Connected' }
    else { b.classList.remove('connected'); b.classList.add('disconnected'); b.textContent = text||'Disconnected' }
  }

  function showToast(msg,isErr=false,timeout=2500){ const t=document.createElement('div'); t.className='toast'+(isErr? ' error':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),350)},timeout)}

  function initWS(){
    ws = new WebSocket(SIGNALING)
    setStatus(false,'Connecting...')
    ws.onopen = ()=>{
      console.log('ws open ->', SIGNALING)
      setStatus(true,'Connected')
      const name = localStorage.getItem('username') || 'Teacher'
      ws.send(JSON.stringify({ type: 'register-teacher', payload: { username: name } }))
    }
    ws.onmessage = e=>{
      try{ const msg = JSON.parse(e.data); console.log('ws msg', msg); handleSignal(msg) }catch(err){console.error(err)}
    }
    ws.onerror = e=>{ console.error('ws err', e); showToast('WebSocket error', true) }
    ws.onclose = ()=>{ setStatus(false,'Disconnected'); showToast('Disconnected', true); setTimeout(initWS, 1500) }
  }

  function handleSignal(msg){
    if(msg.type === 'registered'){ clientId = msg.clientId; document.getElementById('targetInfo').textContent = `Target: ${TARGET_NAME}` }
    else if(msg.type === 'answer'){
      // payload may include { answer, meta }
      const payload = msg.payload || {}
      if(payload && payload.answer && payload.meta){
        const mode = payload.meta.mode
        const pc = pcs[mode]
        if(pc){ pc.setRemoteDescription(new RTCSessionDescription(payload.answer)).catch(e=>console.warn(e)); return }
      }
      // fallback: try default handler
      handleAnswer(msg.fromId, payload.answer || payload)
    }
    else if(msg.type === 'ice-candidate'){
      const payload = msg.payload
      if(payload && payload.candidate && payload.meta){
        const mode = payload.meta.mode
        const pc = pcs[mode]
        if(pc){ pc.addIceCandidate(new RTCIceCandidate(payload.candidate)).catch(()=>{}) ; return }
      }
      // fallback: try to add to any open pc
      Object.values(pcs).forEach(p=>{ try{ if(payload) p.addIceCandidate(new RTCIceCandidate(payload.candidate||payload)).catch(()=>{}) }catch(e){} })
    }
    else if(msg.type === 'device-list'){ /* optional */ }
  }

  async function requestMedia(mode){
    if(!ws || ws.readyState!==1) return showToast('Signaling not ready',true)
    if(!TARGET_ID) return showToast('No target specified', true)
    if(pcs[mode]){ try{ pcs[mode].close() }catch(e){}; delete pcs[mode] }

    const pc = new RTCPeerConnection(RTC_CONFIG)
    pcs[mode] = pc

    pc.ontrack = ev => {
      const isWebcam = mode === 'webcam'
      const v = document.getElementById(isWebcam ? 'webcamVideo' : 'remoteVideo')
      const p = document.getElementById(isWebcam ? 'webcamPlaceholder' : 'placeholder')
      const btn = document.getElementById('btnFullscreen')
      let stream = (ev.streams && ev.streams[0])
      if(!stream){ stream = new MediaStream(); if(ev.track) stream.addTrack(ev.track) }
      v.srcObject = stream
      v.style.display = ''
      if(p) p.style.display = 'none'
      // Show fullscreen button for screen share
      if(!isWebcam && btn) btn.style.display = ''
      stream.getTracks().forEach(t => { 
        t.onended = () => {
          try{ v.srcObject = null }catch(e){}
          v.style.display = 'none'
          if(p) p.style.display = ''
          // Hide fullscreen button when stream ends
          if(!isWebcam && btn) btn.style.display = 'none'
        } 
      })
    }

    pc.onicecandidate = ev => { if(ev.candidate) ws.send(JSON.stringify({ type:'ice-candidate', targetId: TARGET_ID, payload: { candidate: ev.candidate, meta: { mode } } })) }

    try{
      try{ pc.addTransceiver('video', { direction: 'recvonly' }) }catch(e){}
      const offer = await pc.createOffer()
      await pc.setLocalDescription(offer)
      const out = { type: 'offer', targetId: TARGET_ID, payload: { desc: offer, meta: { mode } } }
      console.log('sending offer ->', out)
      ws.send(JSON.stringify(out))
      showToast('Offer sent')
    }catch(err){ console.error(err); showToast(err.message, true) }
  }

  async function handleAnswer(fromId, answer){
    let applied = false
    Object.values(pcs).forEach(p=>{
      try{ p.setRemoteDescription(new RTCSessionDescription(answer)).then(()=>{ applied=true }).catch(()=>{}) }catch(e){}
    })
    if(!applied) console.warn('No pc found to set remote description')
  }

  // Minimize: collapse video and hide controls; Maximize: toggle fullscreen
  function toggleMinimize(){
    document.body.classList.toggle('minimized')
    const btn = document.getElementById('btnMinimize')
    if(btn) btn.textContent = document.body.classList.contains('minimized') ? 'Restore' : 'Minimize'
  }

  function toggleMaximize(){
    const btn = document.getElementById('btnMaximize')
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{})
      if(btn) btn.textContent = 'Exit Full'
    } else {
      document.exitFullscreen().catch(()=>{})
      if(btn) btn.textContent = 'Maximize'
    }
  }

  document.addEventListener('DOMContentLoaded', ()=>{
    if(TARGET_NAME) document.getElementById('title').textContent = `Teacher View — ${TARGET_NAME}`
    document.getElementById('btnScreen').addEventListener('click', ()=>requestMedia('screen'))
    document.getElementById('btnWebcam').addEventListener('click', ()=>requestMedia('webcam'))
    document.getElementById('btnMinimize').addEventListener('click', toggleMinimize)
    document.getElementById('btnMaximize').addEventListener('click', toggleMaximize)
    document.getElementById('btnFullscreen').addEventListener('click', toggleFullscreen)
    document.getElementById('btnCloseStream').addEventListener('click', ()=>{
      Object.keys(pcs).forEach(k=>{
        try{ pcs[k].getSenders().forEach(s=>{ try{ s.track && s.track.stop() }catch(e){} }) }catch(e){}
        try{ pcs[k].close() }catch(e){}
        delete pcs[k]
      })
      const rv = document.getElementById('remoteVideo'); rv.srcObject=null; rv.style.display='none'
      const wb = document.getElementById('webcamVideo'); wb.srcObject=null; wb.style.display='none'
      const p = document.getElementById('placeholder'); if(p) p.style.display=''
      const wp = document.getElementById('webcamPlaceholder'); if(wp) wp.style.display=''
    })
    initWS()
  })

  function toggleFullscreen(){
    const wrap = document.getElementById('videoWrap')
    const btn = document.getElementById('btnFullscreen')
    if(!wrap) return
    if(!document.fullscreenElement){
      wrap.requestFullscreen().catch(err => console.error(err))
      if(btn) btn.textContent = '⛶ Exit Fullscreen'
    } else {
      document.exitFullscreen().catch(()=>{})
      if(btn) btn.textContent = '⛶ Fullscreen'
    }
  }

  // Teachers: Keep session alive, don't auto-logout on close
  window.addEventListener('beforeunload', ()=>{
    // Teacher sessions persist in localStorage
    // No auto-logout on page close for teachers
  })
</script>
</body>
</html>
