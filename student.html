<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Student — CLS</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="signal-server" content="wss://cls-11-ict.onrender.com">
  </head>
  <body>
  <!-- Auth guard: redirect if not logged in -->
  <script>
    (function(){
      const role = (localStorage.getItem('role')||'').toLowerCase()
      if(!role || role !== 'student'){
        window.location.href = 'login.html'
      }
    })()
  </script>
    <header>
      <div class="brand">
        <div class="logo">CLS</div>
        <div>
          <h1>Student View</h1>
          <div class="small">Student client</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span id="stuStatus" class="status-badge disconnected">Disconnected</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn" onclick="logout()" style="background:#ef4444">Logout</button>
      </div>
    </header>

    <main>
      <section style="max-width:760px;margin:24px auto;padding:12px">
        <h2>Your Screen</h2>
        <p>Your screen can be viewed by your teacher when requested.</p>
        <video id="localPreview" autoplay playsinline style="width:100%;height:360px;background:#051224;border-radius:8px"></video>

        <div id="requestModal" style="margin-top:20px;padding:16px;border-radius:12px;border:2px solid #fbbf24;background:rgba(251,191,36,0.05);display:none">
          <h3 style="margin:0 0 12px">Teacher Request</h3>
          <p style="margin:0 0 12px">Your teacher is requesting to view your screen.</p>
          <div style="display:flex;gap:8px">
            <button class="btn secondary" onclick="denyScreenShare()">Deny</button>
            <button class="btn" style="background:#10b981" onclick="approveScreenShare()">Approve & Share</button>
          </div>
        </div>

        <!-- Proactive share removed; students only respond to teacher requests -->
      </section>
    </main>

    <script>
      // Prefer local signaling when testing on localhost, otherwise use meta or fallback
      const SIGNALING = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? `ws://${window.location.host}`
        : (document.querySelector('meta[name="signal-server"]')?.content || 'wss://cls-11-ict.onrender.com')
      const RTC_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
      let ws = null, clientId = null, pc = null, reconnectAttempts = 0
      const MAX_BACKOFF = 16000
      const pcs = new Map()
      let pendingOffer = null
      let activeSharedStream = null

      function setStuStatus(connected, text){
        const el = document.getElementById('stuStatus')
        if(!el) return
        if(connected){ el.classList.remove('disconnected'); el.classList.add('connected'); el.textContent = text||'Connected' }
        else { el.classList.remove('connected'); el.classList.add('disconnected'); el.textContent = text||'Disconnected' }
      }

      function showToast(msg, isError=false, timeout=3000){
        const t = document.createElement('div'); t.className = 'toast' + (isError?' error':''); t.textContent = msg; document.body.appendChild(t)
        setTimeout(()=>{ t.style.opacity = '0'; setTimeout(()=>t.remove(),350) }, timeout)
      }

      function initWS(){
        ws = new WebSocket(SIGNALING)
        setStuStatus(false, 'Connecting...')
        ws.onopen = ()=>{
          console.log('ws open ->', SIGNALING)
          reconnectAttempts=0; setStuStatus(true,'Connected'); showToast('Signaling connected')
          const name = localStorage.getItem('username') || ('student-'+Math.floor(Math.random()*9000+1000))
          // send payload object (server expects msg.payload.username)
          ws.send(JSON.stringify({ type: 'register-student', payload: { username: name } }))
          localStorage.setItem('username', name)
        }
        ws.onmessage = e=>{
          try{
            const msg = JSON.parse(e.data)
            console.log('ws message ->', msg)
            handleSignal(msg)
          }catch(err){console.error('ws message parse', err)}
        }
        ws.onerror = (err)=>{ console.error('ws error', err); showToast('WebSocket error', true) }
        ws.onclose = ()=>{
          setStuStatus(false,'Disconnected'); showToast('Disconnected', true)
          reconnectAttempts++; const backoff = Math.min(1000 * Math.pow(2, reconnectAttempts), MAX_BACKOFF)
          setTimeout(initWS, backoff)
        }
      }

      async function handleSignal(msg){
        console.log('student ws message ->', msg)
        if(msg.type === 'offer'){
          // payload is expected as { desc: <RTCDesc>, meta: { mode } }
          const fromId = msg.fromId
          const payload = msg.payload || {}
          const offer = payload.desc
          const meta = payload.meta || { mode: 'screen' }
          console.log('received offer from', fromId, 'meta', meta)
          handleOffer(fromId, offer, meta)
        }
        else if(msg.type === 'ice-candidate'){
          try{
            if(pc && msg.payload){
              // payload may be { candidate, meta } or just candidate
              const candidate = msg.payload.candidate || msg.payload
              console.log('adding ICE candidate', candidate)
              await pc.addIceCandidate(new RTCIceCandidate(candidate))
            }
          }catch(e){ console.warn('ice error', e) }
        }
      }

      function handleOffer(fromId, offer, meta){
        pendingOffer = { fromId, offer, meta }
        const modal = document.getElementById('requestModal')
        if(modal){
          const modeText = meta.mode === 'webcam' ? 'webcam' : 'screen'
          modal.querySelector('h3').textContent = 'Teacher Request'
          modal.querySelector('p').textContent = `Your teacher is requesting to view your ${modeText}.`
          modal.style.display = 'block'
        }
      }

      async function approveScreenShare(){
        if(!pendingOffer || !ws) return
        const { fromId, offer, meta } = pendingOffer
        try{
          pc = new RTCPeerConnection(RTC_CONFIG)
          pcs.set(fromId, pc)
          await pc.setRemoteDescription(new RTCSessionDescription(offer))
          let stream
          try{
            if(meta && meta.mode === 'webcam'){
              stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            } else {
              stream = await navigator.mediaDevices.getDisplayMedia({ video: true })
            }
          }catch(permErr){
            console.error('Permission denied or device not found:', permErr.message)
            // send rejection if user denied
            ws.send(JSON.stringify({type:'answer-reject', targetId: fromId}))
            const modal = document.getElementById('requestModal'); if(modal) modal.style.display = 'none'
            showToast('Permission denied or device not found', true)
            pendingOffer = null
            return
          }
          stream.getTracks().forEach(t=>pc.addTrack(t, stream))
          const v = document.getElementById('localPreview'); v.srcObject = stream
          pc.onicecandidate = ev => { if(ev.candidate) ws.send(JSON.stringify({type:'ice-candidate', targetId: fromId, payload: { candidate: ev.candidate, meta } })) }
          const answer = await pc.createAnswer()
          await pc.setLocalDescription(answer)
          console.log('sending answer ->', { targetId: fromId, payload: { answer, meta } })
          ws.send(JSON.stringify({type:'answer', targetId: fromId, payload: { answer, meta } }))
          const modal = document.getElementById('requestModal'); if(modal) modal.style.display = 'none'
          stream.getTracks().forEach(track => { track.onended = ()=>{ v.srcObject=null; pc.close(); pcs.delete(fromId) } })
        }catch(err){ console.error(err); showToast(err.message, true) }
        pendingOffer = null
      }

      function denyScreenShare(){
        if(!pendingOffer || !ws) return
        const { fromId } = pendingOffer
        ws.send(JSON.stringify({type:'answer-reject', targetId: fromId}))
        const modal = document.getElementById('requestModal'); if(modal) modal.style.display = 'none'
        pendingOffer = null
      }

      document.addEventListener('DOMContentLoaded', ()=>{ if(!localStorage.getItem('username')) localStorage.setItem('username','Student'); initWS() })

      function logout(){
        const sessionId = localStorage.getItem('sessionId')
        // Call logout API to record logout time
        if (sessionId) {
          fetch('/api/logout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId })
          }).catch(e => console.warn('Logout API error:', e))
        }
        localStorage.clear()
        window.location.href = 'login.html'
      }

      // Auto-logout student when page is closed/unloaded
      window.addEventListener('beforeunload', ()=>{
        const role = localStorage.getItem('role')
        if(role === 'student'){
          const sessionId = localStorage.getItem('sessionId')
          // Send logout signal to server API (fire and forget)
          if (sessionId) {
            fetch('/api/logout', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sessionId }),
              keepalive: true
            }).catch(e => console.warn('Logout API error:', e))
          }
          // Also send WebSocket logout if connected
          if(ws && ws.readyState === WebSocket.OPEN){
            ws.send(JSON.stringify({type:'logout', sessionId}))
          }
          localStorage.clear()
        }
      })
    </script>
  </body>
</html>
